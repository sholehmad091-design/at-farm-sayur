<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelola AT FARM SAYUR</title>
<style>
:root{--g:#173d2a;--l:#2e7548;--p:#edf5e9;--bg:#f5f7f2;--line:#dfe8de}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px system-ui;color:#203428}.top{background:var(--g);color:white;padding:17px 20px;font-weight:800;position:sticky;top:0;z-index:2}.wrap{max-width:1050px;margin:22px auto;padding:0 14px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #173d2a0a}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}label{font-weight:700;color:#385342}input,textarea,select{width:100%;padding:11px;border:1px solid #d7e2d7;border-radius:9px;font:inherit;background:white}textarea{min-height:72px;resize:vertical}button{border:0;border-radius:9px;padding:11px 15px;background:var(--l);color:white;font-weight:750;cursor:pointer}.secondary{background:#eaf2e7;color:var(--g)}.danger{background:#a33}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{background:#eaf2e7;color:var(--g)}.tabs button.active{background:var(--g);color:white}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status{color:#47634f;font-size:13px;margin-top:8px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.item{border:1px solid var(--line);border-radius:12px;padding:12px}.item img{width:100%;height:120px;object-fit:contain;background:#eff5ea;border-radius:8px}.item strong{display:block;margin:7px 0}.hint{font-size:12px;color:#6b796e}@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{margin:12px auto}.panel{padding:14px}}

.dashboard-head{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 18px;gap:10px}
.dash-brand{display:flex;align-items:center;gap:10px;color:#202820;font-size:14px}
.phone-mark{width:17px;height:24px;border:2px solid var(--l);border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:var(--l);font-size:13px;font-weight:800}
.feature-pill{background:#dcf4e2;color:#16803d;border-radius:20px;padding:4px 9px;font-size:10px;font-weight:800}
.menu-grid{background:#fff;border:1px solid #e0e5e0;border-radius:17px;padding:20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px;row-gap:8px;box-shadow:0 4px 18px #172c1d08}
.menu-card{appearance:none;background:transparent;color:#171d19;border:0;border-radius:10px;text-align:left;padding:9px 7px 13px;min-height:82px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;transition:background .15s}
.menu-card:hover{background:#f4f8f3}
.menu-icon{height:21px;display:flex;align-items:center;font-size:20px;line-height:1;color:#151b17;font-weight:600}
.menu-card strong{font-size:14px;font-weight:650;line-height:1.25}
.menu-card small{font-size:11px;color:#788078;font-weight:400;line-height:1.45}
.section-toolbar{display:flex;justify-content:space-between;align-items:center;margin:14px 0;gap:10px}
.back-menu{font-size:12px;padding:9px 12px}
#siteTab .panel,#productTab .panel{scroll-margin-top:85px}
@media(max-width:520px){.menu-grid{padding:12px;column-gap:8px;row-gap:4px}.menu-card{padding:9px 5px 12px;min-height:88px}.menu-card strong{font-size:13px}.menu-card small{font-size:10px}.dashboard-head{padding-bottom:13px}}
</style></head><body><div class="top">🌱 AT FARM SAYUR — PANEL ADMIN</div><main class="wrap">
<section id="login" class="panel"><h2>Masuk Admin</h2><p class="hint">Gunakan password admin. Jika pertama kali, buat password minimal 8 karakter.</p><div class="field"><label>Password Admin</label><input id="password" type="password" autocomplete="current-password"></div><div class="row" style="margin-top:12px"><button onclick="login()">Masuk / Buat Password</button></div><div id="loginMsg" class="status"></div></section>
<section id="app" class="hidden">
<div id="menuDashboard">
<div class="dashboard-head"><div class="dash-brand"><span class="phone-mark">▯</span><strong>AT FARM ADMIN</strong></div><span class="feature-pill">Panel pengelolaan</span></div>
<div class="menu-grid">
<button class="menu-card" onclick="goMenu('bannerPanel')"><span class="menu-icon">▧</span><strong>Banner utama</strong><small>Ganti foto dan tulisan halaman depan</small></button>
<button class="menu-card" onclick="goMenu('photoPanel')"><span class="menu-icon">▱</span><strong>Foto website</strong><small>Ganti semua gambar dan ilustrasi</small></button>
<button class="menu-card" onclick="goMenu('textPanel')"><span class="menu-icon">T</span><strong>Tulisan website</strong><small>Edit judul, deskripsi, dan keterangan</small></button>
<button class="menu-card" onclick="goMenu('categoryPanel')"><span class="menu-icon">▦</span><strong>Kategori pilihan</strong><small>Edit nama, gambar, dan deskripsi kategori</small></button>
<button class="menu-card" onclick="goMenu('aboutPanel')"><span class="menu-icon">▤</span><strong>Tentang AT FARM</strong><small>Edit profil dan foto usaha</small></button>
<button class="menu-card" onclick="goMenu('contactPanel')"><span class="menu-icon">♧</span><strong>Kontak dan WhatsApp</strong><small>Ganti nomor, informasi, dan tautan</small></button>
<button class="menu-card" onclick="goMenu('identityPanel')"><span class="menu-icon">▣</span><strong>Tombol dan menu</strong><small>Atur nama tombol dan navigasi</small></button>
<button class="menu-card" onclick="goMenu('identityPanel')"><span class="menu-icon">⚙</span><strong>Identitas website</strong><small>Logo, nama usaha, dan informasi footer</small></button>
<button class="menu-card" onclick="goProducts()"><span class="menu-icon">▤</span><strong>Produk dan stok</strong><small>Kelola katalog, harga, dan ketersediaan</small></button>
</div>
</div>
<div class="section-toolbar hidden" id="sectionToolbar"><button class="secondary back-menu" onclick="backMenu()">← Kembali ke PANEL PENGELOLAAN</button><button class="secondary" onclick="logout()">Keluar</button></div>
<div id="activeSectionTitle" class="hidden" style="font-size:18px;font-weight:800;margin:12px 2px"></div>
<div class="tabs" style="display:none"><button class="active" data-tab="site" onclick="tab('site',this)">Konten Website</button><button data-tab="product" onclick="tab('product',this)">Produk & Stok</button></div>
<div id="siteTab">
<div class="panel" id="identityPanel"><h3>Identitas & Kontak</h3><div class="grid">
<div class="field"><label>Nama usaha / judul browser</label><input id="brandName"></div><div class="field"><label>Nomor WhatsApp (628...)</label><input id="whatsapp"></div>
<div class="field full"><label>Logo website</label><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp"><div class="hint" id="logoPreview"></div></div>
</div></div>
<div class="panel" id="bannerPanel"><h3>Beranda / Banner Utama</h3><div class="grid">
<div class="field"><label>Teks kecil di atas judul</label><input id="heroEyebrow"></div><div class="field"><label>Label pada foto</label><input id="heroStamp"></div>
<div class="field full" id="textPanel"><label>Judul besar</label><textarea id="heroTitle"></textarea></div><div class="field full"><label>Deskripsi beranda</label><textarea id="heroText"></textarea></div>
<div class="field full" id="photoPanel"><label>Foto banner utama</label><input id="heroImageFile" type="file" accept="image/png,image/jpeg,image/webp"><div class="hint" id="heroImagePreview"></div></div>
</div></div>
<div class="panel" id="categoryPanel"><h3>Kategori & Produk</h3><div class="grid">
<div class="field"><label>Judul kategori</label><input id="categoryTitle"></div><div class="field"><label>Keterangan kategori</label><input id="categorySubtitle"></div>
<div class="field"><label>Judul bagian produk</label><input id="productsTitle"></div><div class="field"><label>Keterangan bagian produk</label><input id="productsSubtitle"></div>
<div class="field"><label>Ikon kategori 1</label><input id="catIcon1"></div><div class="field"><label>Nama kategori 1</label><input id="catName1"></div><div class="field full"><label>Deskripsi kategori 1</label><input id="catDesc1"></div>
<div class="field"><label>Ikon kategori 2</label><input id="catIcon2"></div><div class="field"><label>Nama kategori 2</label><input id="catName2"></div><div class="field full"><label>Deskripsi kategori 2</label><input id="catDesc2"></div>
<div class="field"><label>Ikon kategori 3</label><input id="catIcon3"></div><div class="field"><label>Nama kategori 3</label><input id="catName3"></div><div class="field full"><label>Deskripsi kategori 3</label><input id="catDesc3"></div>
</div></div>
<div class="panel" id="aboutPanel"><h3>Tentang Kami</h3><div class="grid">
<div class="field"><label>Ikon / emoji (jika tanpa foto)</label><input id="aboutEmoji"></div><div class="field"><label>Kalimat slogan</label><input id="aboutTagline"></div>
<div class="field"><label>Nama pada kartu</label><input id="aboutBrand"></div><div class="field"><label>Judul tentang kami</label><input id="aboutTitle"></div>
<div class="field full"><label>Paragraf pertama</label><textarea id="aboutText1"></textarea></div><div class="field full"><label>Paragraf kedua</label><textarea id="aboutText2"></textarea></div>
<div class="field full"><label>Foto bagian Tentang Kami (opsional)</label><input id="aboutImageFile" type="file" accept="image/png,image/jpeg,image/webp"><div class="hint" id="aboutImagePreview"></div></div>
</div></div>
<div class="panel" id="contactPanel"><h3>Kontak & Footer</h3><div class="grid">
<div class="field"><label>Judul ajakan kontak</label><input id="contactTitle"></div><div class="field"><label>Teks ajakan kontak</label><input id="contactText"></div>
<div class="field full"><label>Catatan kontak / alamat / jam buka</label><textarea id="contactNote"></textarea></div><div class="field"><label>Teks nama footer</label><input id="footerBrand"></div><div class="field"><label>Teks hak cipta</label><input id="footerText"></div>
</div><div class="row" style="margin-top:14px"><button onclick="saveSite()">Simpan Semua Perubahan Website</button></div><div id="siteMsg" class="status"></div></div>
</div>
<div id="productTab" class="hidden">
<div class="panel"><h3 id="productFormTitle">Tambah Produk</h3><input type="hidden" id="p_id"><div class="grid">
<div class="field"><label>Nama produk</label><input id="p_name"></div><div class="field"><label>Kategori</label><select id="p_category"><option>Sayuran</option><option>Buah</option><option>Bumbu</option></select></div>
<div class="field full"><label>Deskripsi</label><input id="p_description"></div><div class="field"><label>Harga</label><input id="p_price" type="number" min="0"></div><div class="field"><label>Satuan</label><input id="p_unit" placeholder="kg / ikat / pcs"></div>
<div class="field"><label>Stok</label><input id="p_stock" type="number" min="0"></div><div class="field"><label>Status</label><select id="p_active"><option value="true">Aktif</option><option value="false">Nonaktif</option></select></div>
<div class="field full"><label>Foto produk</label><input id="p_photo_file" type="file" accept="image/png,image/jpeg,image/webp"><div class="hint" id="p_photo_hint"></div></div>
</div><div class="row" style="margin-top:12px"><button onclick="saveProduct()">Simpan Produk</button><button class="secondary" onclick="resetProduct()">Batal / Produk Baru</button></div><div id="productMsg" class="status"></div></div>
<div class="panel"><h3>Daftar Produk</h3><div id="productList" class="products"></div></div>
</div></section></main>
<script>
let TOKEN='',settings={},products=[],pendingPhoto='';
function msg(id,s){document.getElementById(id).textContent=s||''}
function login(){const pw=document.getElementById('password').value;msg('loginMsg','Memeriksa...');google.script.run.withSuccessHandler(r=>{if(r.ok){TOKEN=r.token;openApp()}else if(r.setupRequired){google.script.run.withSuccessHandler(()=>login()).withFailureHandler(e=>msg('loginMsg',e.message)).setupAdminPassword(pw)}else msg('loginMsg',r.message||'Gagal login')}).withFailureHandler(e=>msg('loginMsg',e.message)).adminLogin(pw)}
function openApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');showDashboard();loadSite();loadProducts()}
function hideAllSections(){document.querySelectorAll('#siteTab > .panel').forEach(p=>p.classList.add('hidden'));document.getElementById('siteTab').classList.add('hidden');document.getElementById('productTab').classList.add('hidden')}
function showDashboard(){hideAllSections();document.getElementById('menuDashboard').classList.remove('hidden');document.getElementById('sectionToolbar').classList.add('hidden');document.getElementById('activeSectionTitle').classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
function goMenu(id){hideAllSections();document.getElementById('menuDashboard').classList.add('hidden');document.getElementById('sectionToolbar').classList.remove('hidden');const titleMap={bannerPanel:'Banner utama',photoPanel:'Foto website',textPanel:'Tulisan website',categoryPanel:'Kategori pilihan',aboutPanel:'Tentang AT FARM',contactPanel:'Kontak dan WhatsApp',identityPanel:'Identitas website'};const panelId=(id==='photoPanel'||id==='textPanel')?'bannerPanel':id;const target=document.getElementById(panelId);if(target){document.getElementById('siteTab').classList.remove('hidden');target.classList.remove('hidden');const heading=document.getElementById('activeSectionTitle');heading.textContent=titleMap[id]||'Pengaturan website';heading.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});}}
function goProducts(){hideAllSections();document.getElementById('menuDashboard').classList.add('hidden');document.getElementById('sectionToolbar').classList.remove('hidden');document.getElementById('productTab').classList.remove('hidden');const heading=document.getElementById('activeSectionTitle');heading.textContent='Produk dan stok';heading.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
function backMenu(){showDashboard()}

function logout(){TOKEN='';document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
function tab(which,btn){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('siteTab').classList.toggle('hidden',which!=='site');document.getElementById('productTab').classList.toggle('hidden',which!=='product')}
const keys=['brandName','whatsapp','heroEyebrow','heroTitle','heroText','heroStamp','categoryTitle','categorySubtitle','productsTitle','productsSubtitle','catIcon1','catName1','catDesc1','catIcon2','catName2','catDesc2','catIcon3','catName3','catDesc3','aboutEmoji','aboutTagline','aboutBrand','aboutTitle','aboutText1','aboutText2','contactTitle','contactText','contactNote','footerBrand','footerText'];
function loadSite(){google.script.run.withSuccessHandler(s=>{settings=s||{};keys.forEach(k=>{const e=document.getElementById(k);if(e)e.value=settings[k]||''});['logoUrl','heroImageUrl','aboutImageUrl'].forEach(k=>{const id={logoUrl:'logoPreview',heroImageUrl:'heroImagePreview',aboutImageUrl:'aboutImagePreview'}[k];document.getElementById(id).textContent=settings[k]?'Foto tersimpan: '+settings[k]:'Belum ada foto khusus.'})}).withFailureHandler(e=>msg('siteMsg',e.message)).getAdminSiteSettings(TOKEN)}
function fileData(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=reject;rd.readAsDataURL(file)})}
async function uploadInput(inputId,oldKey){const f=document.getElementById(inputId).files[0];if(!f)return settings[oldKey]||'';const data=await fileData(f);const r=await new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).uploadAsset(TOKEN,data,f.name));return r.url}
async function saveSite(){try{msg('siteMsg','Mengunggah foto dan menyimpan...');const s={};keys.forEach(k=>s[k]=document.getElementById(k).value);s.logoUrl=await uploadInput('logoFile','logoUrl');s.heroImageUrl=await uploadInput('heroImageFile','heroImageUrl');s.aboutImageUrl=await uploadInput('aboutImageFile','aboutImageUrl');google.script.run.withSuccessHandler(r=>{settings=r.settings||s;msg('siteMsg','Berhasil disimpan. Website publik akan menampilkan perubahan setelah dimuat ulang.')}).withFailureHandler(e=>msg('siteMsg',e.message)).saveSiteSettings(TOKEN,s)}catch(e){msg('siteMsg',e.message||String(e))}}
function loadProducts(){google.script.run.withSuccessHandler(list=>{products=list||[];renderProducts()}).withFailureHandler(e=>msg('productMsg',e.message)).getAdminProducts(TOKEN)}
function renderProducts(){document.getElementById('productList').innerHTML=products.map(p=>`<div class="item">${p.photo?`<img src="${esc(p.photo)}">`:''}<strong>${esc(p.name)}</strong><div class="hint">${esc(p.category)} · Stok ${p.stock} ${esc(p.unit)} · ${p.active?'Aktif':'Nonaktif'}</div><div class="row" style="margin-top:8px"><button class="secondary" onclick="editProduct('${esc(p.id)}')">Edit</button><button class="danger" onclick="removeProduct('${esc(p.id)}')">Hapus</button></div></div>`).join('')||'<p>Belum ada produk.</p>'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;[['id','id'],['name','name'],['description','description'],['category','category'],['price','price'],['unit','unit'],['stock','stock'],['active','active']].forEach(([a,b])=>document.getElementById('p_'+a).value=p[b]);settings.productPhoto=p.photo||'';document.getElementById('productFormTitle').textContent='Edit Produk: '+p.name;document.getElementById('p_photo_hint').textContent=p.photo?'Foto tersimpan. Pilih foto baru jika ingin mengganti.':'';window.scrollTo({top:0,behavior:'smooth'})}
function resetProduct(){['id','name','description','price','unit','stock'].forEach(k=>document.getElementById('p_'+k).value='');document.getElementById('p_category').value='Sayuran';document.getElementById('p_active').value='true';document.getElementById('p_photo_file').value='';settings.productPhoto='';document.getElementById('productFormTitle').textContent='Tambah Produk';msg('productMsg','')}
async function saveProduct(){try{msg('productMsg','Menyimpan...');let photo=settings.productPhoto||'';const f=document.getElementById('p_photo_file').files[0];if(f){const d=await fileData(f);const up=await new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).uploadAsset(TOKEN,d,f.name));photo=up.url;}const p={id:document.getElementById('p_id').value,name:document.getElementById('p_name').value,description:document.getElementById('p_description').value,category:document.getElementById('p_category').value,price:document.getElementById('p_price').value,unit:document.getElementById('p_unit').value,stock:document.getElementById('p_stock').value,active:document.getElementById('p_active').value==='true',photo};google.script.run.withSuccessHandler(r=>{products=r.products||[];renderProducts();resetProduct();msg('productMsg','Produk berhasil disimpan.')}).withFailureHandler(e=>msg('productMsg',e.message)).saveProduct(TOKEN,p)}catch(e){msg('productMsg',e.message||String(e))}}
function removeProduct(id){if(!confirm('Hapus produk ini?'))return;google.script.run.withSuccessHandler(r=>{products=r.products||[];renderProducts();msg('productMsg','Produk dihapus.')}).withFailureHandler(e=>msg('productMsg',e.message)).deleteProduct(TOKEN,id)}
</script></body></html>
